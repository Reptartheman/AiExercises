<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Scoreboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="scoreboard">
        <h1>Baseball Scoreboard</h1>
        <div id="scores">
            <div>Team A: <span id="teamA-score">0</span></div>
            <div>Team B: <span id="teamB-score">0</span></div>
        </div>
        <button id="increaseA">Increase Team A Score</button>
        <button id="increaseB">Increase Team B Score</button>
    </div>

    <div id="lineup">
      <h1>Baseball Lineup</h1>
      <ul id="players">
          <li>Player 1</li>
          <li>Player 2</li>
          <li>Player 3</li>
      </ul>
      <input type="text" id="newPlayer" placeholder="Add a new player">
      <button id="addPlayer">Add Player</button>
  </div>
    <script src="./script.js"></script>
</body>
</html>
